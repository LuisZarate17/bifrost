[package]
name = "bifrost-core"
version = "0.1.0"
edition = "2024"

# Shared by `capture/` (the CLI) and `src-tauri/` (the app). Extracted at C4b,
# when the second caller appeared and the seam was finally known — extracting
# against one caller would have been guessing at the signature.
#
# Deliberately blocking: both callers drive it from a thread of their own, and
# the app already runs its animator and mouse hook that way.

[dependencies]
nvml-wrapper = "0.13.0"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "native-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
similar = "2"
# For `search`: ripgrep's own walker, which reads .gitignore files, and its glob
# matcher. Neither has a proc-macro, so neither gives Smart App Control a fresh
# DLL to refuse at build time.
ignore = "0.4.33"
globset = "0.4.20"

# For `check`: a job object, so everything a check command starts can be ended
# together — on Stop, when the command leaves something running, and when the
# app exits mid-check. The same version the apps already build, so nothing new
# is compiled but these features.
[target."cfg(windows)".dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }
