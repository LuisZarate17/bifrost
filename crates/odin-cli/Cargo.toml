[package]
name = "odin-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "odin"
path = "src/main.rs"

[dependencies]
odin-core = { path = "../odin-core" }
base64 = "0.23"
image = "0.25.10"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "native-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
windows-capture = "2.0.1"
