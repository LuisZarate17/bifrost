name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # Job objects and the tray app are Windows-only.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: npm ci
        run: npm ci

      # The Tauri app crates embed ../dist at compile time, so the frontends must be built first.
      - name: Build vidar frontend
        run: npm run build -w apps/vidar

      - name: Build mimir frontend
        run: npm run build -w apps/mimir

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

      - name: check:inert
        run: npm run check:inert
