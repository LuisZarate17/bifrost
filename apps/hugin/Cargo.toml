[package]
name = "hugin"
version = "0.1.0"
description = "A terminal agent that works in a folder. Every token stays on this machine."
authors = ["LuisZarate17"]
edition = "2024"

# A plain console app: no Tauri, no window. The model, the tools and the turn loop are
# bifrost-core's, the same ones Mimir runs; this crate is only what a terminal adds.

[dependencies]
bifrost-core = { path = "../../crates/bifrost-core" }
crossterm = "0.29"
ratatui = "0.30"
# For `hugin -p`'s JSON, whose fields have to come in an order that a map would not keep.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-width = "0.2"

# The splash of `hugin-launch` (src/splash.rs): plain Win32 calls, only the features it uses.
[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.59"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
]

# The shortcut key's program: windowless, so starting it never flashes a console.
[[bin]]
name = "hugin"
path = "src/main.rs"

[[bin]]
name = "hugin-launch"
path = "src/launch_main.rs"
