[package]
name = "citadel"
version = "0.1.0"
description = "A local chat app. Every token stays on this machine."
authors = ["LuisZarate17"]
edition = "2021"

# Deliberately NOT a copy of Warden's dependency list. Citadel is an ordinary
# window, so it needs none of the Win32 work that makes the popup click-through
# and invisible to screen capture: no `windows` crate, no `windows-capture`, no
# global-shortcut plugin, no tray. Adding any of them here would be a bug.

[lib]
# The `_lib` suffix is not redundant: on Windows a lib and a bin cannot share a
# name (rust-lang/cargo#8519). Same reason Warden's is `warden_lib`.
name = "citadel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
odin-core = { path = "../../../crates/odin-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Attachments arrive from the webview already base64-encoded.
base64 = "0.22"
