# One workspace over every crate in the repo, so there is one Cargo.lock and one
# target/ instead of four of each. Added at Before-G0 step 1d, when a fifth crate
# (Mimir) was about to arrive and four separate lockfiles stopped being tolerable.
#
# Four members, not three: Vidar's src-tauri belongs here too. A crate that sits
# inside a workspace tree without being a member — or excluded — fails to build with
# "current package believes it's in a workspace when it's not", which is the same
# error the exclude below prevents.

[workspace]
resolver = "3"
members = [
    "crates/bifrost-core",
    "crates/bifrost-cli",
    "crates/bench",
    "apps/vidar/src-tauri",
    "apps/mimir/src-tauri",
    "apps/hugin",
]

# What a bare `cargo build` at the root builds: the crates, never the two apps. Building an app
# with plain cargo leaves out Tauri's custom-protocol feature, so the exe loads its window from
# `localhost:1420` and shows "can't reach this" without a dev server — and it lands on the same
# target/debug/*.exe the Desktop shortcuts open, replacing the working one. That happened to
# Mimir on 2026-09-24. Apps build with `npm run app:vidar` / `npm run app:mimir`; `--workspace` still
# reaches everything, so `cargo test --workspace` and `cargo clippy --workspace` are unchanged.
#
# Hugin is the exception: a plain console app, with no custom-protocol trap, so a bare
# `cargo build` may build it.
default-members = ["crates/bifrost-core", "crates/bifrost-cli", "crates/bench", "apps/hugin"]

# evals/fixtures/frametest is the E0502 fixture that C1b and fixcheck.mjs are built
# around. It is *meant* not to compile, it is built on its own rather than with the
# workspace, and it keeps its own Cargo.lock. Without this line, `cargo check` in
# that directory stops reaching the borrow checker at all and reports a workspace
# error instead — which looks like the fixture breaking when it is this file's fault.
exclude = ["evals/fixtures/frametest"]

# Moved up from apps/vidar/src-tauri/Cargo.toml at 1d. Cargo only honours profiles
# on the workspace root and downgrades a package-level one to a warning, so these
# settings were being silently ignored the moment the workspace appeared.
# Tauri's guidance: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
